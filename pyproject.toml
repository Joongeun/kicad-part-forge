[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kifab"
version = "0.1.0"
description = "Generate, validate and manage KiCad 9 symbols and footprints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
kifab = "kifab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kifab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
